name: Task
description: Work item with acceptance criteria.
title: "TXX – "
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome are we aiming for?
      placeholder: e.g., Implement the hero section and navbar with luxury styling.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs / References
      description: Links to docs/PRs/issues that define the spec.
      placeholder: e.g., docs/BRAND.md, docs/MOTION.md, etc.
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: Files/components/pages expected.
  - type: checkboxes
    id: acceptance
    attributes:
      label: Acceptance Criteria
      options:
        - label: Matches brand tokens (docs/BRAND.md)
        - label: Motion follows docs/MOTION.md and respects reduced motion
        - label: Mobile layout verified
        - label: Accessibility basics included (labels/focus)
        - label: Docs updated if spec changed
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: What blocks this? What does this block?
