name: SEO + Performance
description: Search visibility and speed improvements.
title: "[SEO/PERF] "
labels: ["seo-perf"]
body:
  - type: textarea
    id: target
    attributes:
      label: Target Metric(s)
      description: e.g., LCP, CLS, INP, crawlability, metadata coverage.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline
      description: Current measurements and how they were captured.
  - type: textarea
    id: done
    attributes:
      label: Done Criteria
      description: Quantified thresholds or expected deltas.
    validations:
      required: true
