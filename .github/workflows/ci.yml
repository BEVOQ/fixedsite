name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (if present)
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts?.typecheck?0:1)" \
            && npm run typecheck \
            || echo "No typecheck script defined, skipping"

      - name: Test (if present)
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts?.test?0:1)" \
            && npm test \
            || echo "No test script defined, skipping"

      - name: Build
        run: npm run build
