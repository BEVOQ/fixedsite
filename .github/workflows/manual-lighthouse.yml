name: Manual Lighthouse

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to audit (Vercel preview or production)"
        required: true
        type: string

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ inputs.target_url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
